name: Build Kare Investment APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate App & Inject Kare Website
        run: |
          flutter create --org com.kareinvestment --project-name kare_app app_build
          cd app_build
          flutter pub add webview_flutter
          sed -i 's/android:label="kare_app"/android:label="Kare Investment Group"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MaterialApp(
              title: 'Kare Investment Group',
              debugShowCheckedModeBanner: false,
              home: WebViewApp(),
            ));
          }

          class WebViewApp extends StatefulWidget {
            const WebViewApp({super.key});
            @override
            State<WebViewApp> createState() => _WebViewAppState();
          }

          class _WebViewAppState extends State<WebViewApp> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) => setState(() => _isLoading = true),
                    onPageFinished: (_) => setState(() => _isLoading = false),
                  ),
                )
                ..loadRequest(Uri.parse('https://kareinvestmentgroup.com/'));
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  }
                },
                child: Scaffold(
                  backgroundColor: Colors.white,
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          const Center(child: CircularProgressIndicator()),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF
          
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Kare-Investment-Group-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
